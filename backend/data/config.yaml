hello_message:
  type: "hello"
  transport: "websocket"
  session_id: None
  audio_params:
    sample_rate: 16000
    channels: 1
    frame_duration: 60
    format: "opus"


prompt: "不要回复表情"

server:
  port: 3001
  host: 0.0.0.0
  websocket_url: 'ws://192.168.0.108:3001/ws'
  version: 1
  token: 'server_AI_Child_1'
  reconnect_interval: 5000

select_model:
  TTS: "EdgeTTS"
  ASR: "FunASR"
  LLM: "openai"
  VAD: "Silero"

TTS:
  EdgeTTS:
    type: "edge"
    output_dir: "ai_core/tts/temp"
    voice: "zh-CN-XiaoxiaoNeural"


LLM:
  # OpenAI兼容的API提供商
  openai:
    type: "openai"
    model_name: "deepseek-chat"
    api_key: "sk-054b723c3a1b4e21839f560466cf6f3d"
    base_url: "https://api.deepseek.com"

  # Ollama本地服务
  ollama:
    type: "ollama"
    base_url: "http://localhost:11434"

# 语法：每个变量后必须要加空格
ASR:
  FunASR:
    type: "fun_asr"
    model_dir: "model\\funasr"
    output_dir: "ai_core\\asr\\tmp"

VAD:
  Silero:
    type: "silero"
    model_dir: "model\\silero-vad"
    min_silence_ms: 600
    threshold: 0.5

# Agent模型配置
agents:
  default:
    provider: "openai"
    model: "deepseek-chat"
    temperature: 0.7
    max_tokens: 500
  safety_agent:
    provider: "openai"
    model: "deepseek-chat"
    temperature: 0.3
    max_tokens: 300
  emotion_agent:
    provider: "openai"
    model: "deepseek-chat"
    temperature: 0.7
    max_tokens: 400

# 日志配置
log:
  # 日志级别
  level: INFO
  # 日志输出路径
  output_dir: "log"
